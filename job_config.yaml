# ---------------------------------------------------------------------------
# job_hunter configuration — edit the searches/filters/keywords to match
# YOUR job hunt, then run:  python jobs.py hunt
# ---------------------------------------------------------------------------

# Saved searches. Each hunt runs every search and stores new postings.
# Names must be unique — they tag each job so you know which search found it.
#
# Optional per-search filters (these map to LinkedIn's own search filters):
#   posted_within:      day | week | month
#   experience_levels:  [internship, entry, associate, mid_senior, director, executive]
#   workplace:          [onsite, remote, hybrid]
#   job_types:          [full_time, part_time, contract, temporary, internship]
#   max_pages:          pages of 25 results to fetch (keep small; see notes below)
searches:
  - name: python-bangalore
    keywords: "python developer"
    location: "Bengaluru, Karnataka, India"
    posted_within: week
    experience_levels: [entry, associate]
    max_pages: 3

  - name: data-remote
    keywords: "data engineer"
    location: "India"
    posted_within: week
    workplace: [remote]
    max_pages: 3

# Hard filters — applied before a job is stored at all.
filters:
  # If non-empty, a job title must contain at least one of these:
  title_include_any: []
  # Drop titles containing any of these (seniority you're not targeting,
  # unrelated roles that keyword searches drag in, etc.):
  title_exclude:
    - "principal"
    - "staff "
    - "architect"
  # Drop these companies entirely (e.g. staffing agencies you're done with):
  company_exclude: []

# Relevance scoring: keyword -> points, summed over the job title.
# Only affects ordering — the best-matching jobs sort to the top.
score_keywords:
  python: 3
  backend: 2
  django: 2
  fastapi: 2
  scraping: 2
  remote: 1

# Politeness controls. LinkedIn throttles anonymous traffic hard (HTTP 429);
# if you see "gave up after N attempts", raise these delays and lower
# max_pages rather than retrying in a loop.
rate_limit:
  min_delay_seconds: 5    # minimum gap between requests
  jitter_seconds: 3       # random 0..N seconds added on top

retry:
  max_attempts: 3
  backoff_base_seconds: 5   # 5s, 10s, 20s...

storage:
  sqlite_path: "data/jobs.db"
