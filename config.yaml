# ---------------------------------------------------------------------------
# quick-commerce-scraper configuration
#
# This file drives scheduled runs: every enabled platform is scraped for
# every (pincode x query) combination and results are appended to SQLite.
# ---------------------------------------------------------------------------

# Delivery locations to monitor. Each platform sets the location BEFORE any
# product/inventory data is fetched (hyperlocal catalogs differ per store).
pincodes:
  - "110001"   # New Delhi (Connaught Place)
  - "560001"   # Bengaluru (MG Road)

# Product search terms to track.
queries:
  - "amul butter 500g"
  - "maggi noodles"
  - "coca cola 750ml"

# Enable/disable individual platform adapters.
platforms:
  blinkit: true
  swiggy_instamart: true
  zepto: true
  bigbasket_now: true
  amazon_now: true
  flipkart_minutes: true

# Politeness / anti-hammering controls (per-domain).
rate_limit:
  min_delay_seconds: 8      # minimum gap between requests to the same domain
  jitter_seconds: 4         # random 0..N seconds added on top of min delay

retry:
  max_attempts: 3           # total attempts per navigation/step
  backoff_base_seconds: 2   # delay = base * 2^(attempt-1), i.e. 2s, 4s, 8s...

browser:
  headless: true
  timeout_seconds: 45       # per-navigation / per-wait timeout
  # Optional upstream proxy for Playwright, e.g. "http://user:pass@host:port".
  # Residential/mobile egress is often required in practice; datacenter IPs
  # are frequently blocked by these platforms.
  proxy: null
  # Optional path to a specific Chromium binary (defaults to the browser
  # installed via `playwright install chromium`).
  executable_path: null

storage:
  sqlite_path: "data/observations.db"

# Max products to record per (platform, pincode, query) search.
max_results_per_search: 15
