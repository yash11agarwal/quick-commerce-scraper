# qcom configuration. Versioned. No secrets here: proxy credentials live in .env.
version: 2

run:
  max_failure_rate: 0.2            # above this share of failed jobs the run exits non-zero
  output_dir: output

browser:
  headless: true
  device: Desktop Chrome           # a Playwright built-in device profile
  navigation_timeout_s: 45
  launch_attempts: 3               # browser acquisition is unreliable; retried with backoff
  executable_path: null            # leave null to use the Chromium that `playwright install chromium` downloads

proxy:
  label: null                      # provider label written to run_meta; credentials in .env

throttle:
  min_gap_s: 8                     # minimum gap between requests to one host
  jitter_s: 4                      # random 0..N seconds added on top

retry:                             # the policy table from docs/REQUIREMENTS.md section 6
  network_timeout:  {attempts: 3, backoff_base_s: 2, jitter_s: 1}
  rate_limited:     {attempts: 2, backoff_base_s: 60, jitter_s: 5}
  proxy_error:      {attempts: 2, backoff_base_s: 5, jitter_s: 1}
  location_not_set: {attempts: 2, backoff_base_s: 3, jitter_s: 1}
  unknown:          {attempts: 1, backoff_base_s: 0, jitter_s: 0}

circuit_breaker:
  consecutive_failures: 5          # per platform, per run

concurrency:
  max_platforms_in_parallel: 2     # 8 GB machine: two Chromium instances at once
  blinkit: 1                       # browser contexts per platform
  swiggy_instamart: 1
  zepto: 1
  bigbasket: 1

storage:
  path: data/qcom.sqlite
  sessions_dir: sessions
  runs_dir: runs

quality:
  price_move_warn_pct: 40          # flag when selling price moves more than this since the previous run
